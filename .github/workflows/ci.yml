# CI: build, typecheck, unit suite, and a real-host boot smoke on every push
# to main and every pull request.
#
# The dsh CLI rides the registry's `alpha` dist-tag — resolved at runtime,
# never hand-pinned (the rc.8 lesson: a hand-pinned rc went stale and rotted
# the gate); the plugin targets >= 0.1.2-alpha.3, so `latest` (still rc.2)
# would boot a host older than the peer floor. No daily schedule by design
# (Q8): this repo has no runtime gate that needs upstream drift detection;
# the boot smoke still runs the plugin under the real host on every change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install dsh CLI (rolling @alpha dist-tag, never hand-pinned)
        run: |
          DSH_VERSION="$(npm view @deepseek-ai/dsh@alpha version)"
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@alpha" --no-audit --no-fund

      # The test files import lib/, so build explicitly before testing.
      - name: Build & Check (tsc)
        run: npm run build && npm run check

      - name: Test (unit suite + corpus replay when a local corpus exists)
        run: npm test

      - name: Install pnpm (the scratch-profile install step drives pnpm)
        run: npm install -g pnpm --no-audit --no-fund

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
