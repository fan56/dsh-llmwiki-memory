# CI: build, typecheck, unit suite, and a real-host boot smoke on every push
# to main and every pull request.
#
# The dsh CLI rides the rc/stable line — the newest of the `latest`
# (stable) and `next` (rc) dist-tags, resolved at runtime, never
# hand-pinned (the stale-pin lesson: a hand-pinned version rotted the
# gate); the alpha line is retired for CI (2026-09-03). No daily schedule by design
# (Q8): this repo has no runtime gate that needs upstream drift detection;
# the boot smoke still runs the plugin under the real host on every change.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha)
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      # The test files import lib/, so build explicitly before testing.
      - name: Build & Check (tsc)
        run: npm run build && npm run check

      - name: Test (unit suite + corpus replay when a local corpus exists)
        run: npm test

      - name: Install pnpm (the scratch-profile install step drives pnpm)
        run: npm install -g pnpm --no-audit --no-fund

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
